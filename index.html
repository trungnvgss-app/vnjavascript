<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MIO JavaScript — Học JS Cực Đỉnh</title>
    <meta name="description" content="App học JavaScript từ cơ bản đến nâng cao: Scope, Closure, this, Prototype, Async.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #080E1A;
            --bg-card:   rgba(15, 23, 42, 0.85);
            --bg-hover:  rgba(20, 30, 55, 0.95);
            --primary:   #4F8EF7;
            --primary-g: rgba(79, 142, 247, 0.35);
            --accent:    #06D6A0;
            --accent-g:  rgba(6, 214, 160, 0.25);
            --purple:    #8B5CF6;
            --yellow:    #F59E0B;
            --red:       #EF4444;
            --correct:   #10B981;
            --bg-main: #0B0F19; --bg-card: #111827;
            --primary: #3B82F6; --primary-hover: #2563EB;
            --accent: #10B981; --text: #F8FAFC; --dim: #94A3B8;
            --border: #1E293B; --border2: #334155;
            --wrong: #EF4444; --correct: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text);
            line-height: 1.6; min-height: 100vh; overflow-x: hidden;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        
        /* ── Header & Authentication ────────────────────────────── */
        header { text-align: center; margin-bottom: 50px; position: relative; }

        h1 { font-family: 'Outfit', sans-serif; font-size: 3rem; margin-bottom: 15px; letter-spacing: -1px; }

        /* ── Tabs ─────────────────────────────────────── */
        .tabs{
            display:flex;justify-content:center;gap:8px;
            background:rgba(8,14,26,0.7);border:1px solid var(--border2);
            backdrop-filter:blur(12px);border-radius:100px;
            padding:8px;width:fit-content;margin:0 auto 36px;
        }
        .tab{
            padding:13px 28px;font-family:'Outfit',sans-serif;
            font-size:1rem;font-weight:700;color:var(--dim);
            background:transparent;border:none;border-radius:100px;
            cursor:pointer;transition:all .3s ease;display:flex;align-items:center;gap:8px;
        }
        .tab:hover{color:var(--text);background:rgba(255,255,255,0.05)}
        .tab.active{
            color:#fff;
            background:var(--primary);
            box-shadow:0 8px 24px rgba(59,130,246,.35);
        }
        .panel{display:none;animation:fadeUp .4s ease-out}
        .panel.active{display:block}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        /* ── Section heading ──────────────────────────── */
        .sec-head{margin-bottom:28px}
        .sec-head h2{font-family:'Outfit',sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:6px}
        .sec-head p{color:var(--dim);font-size:.95rem}

        /* ━━━━━━━━━━━━━━━━ CONCEPT TAB ━━━━━━━━━━━━━━━━ */
        .topic-nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px}
        .topic-pill{
            padding:9px 20px;border-radius:100px;border:1px solid var(--border2);
            background:var(--bg-card);color:var(--dim);cursor:pointer;
            font-family:'Outfit',sans-serif;font-weight:700;font-size:.92rem;
            transition:all .25s ease;display:flex;align-items:center;gap:7px;
        }
        .topic-pill:hover{border-color:var(--primary);color:var(--text)}
        .topic-pill.active{border-color:transparent;color:#fff;background:var(--primary)!important;box-shadow:0 6px 20px rgba(59,130,246,.3)}

        .concept-card{
            background:var(--bg-card);border:1px solid var(--border2);border-radius:22px;
            padding:32px;backdrop-filter:blur(12px);margin-bottom:24px;
        }
        .concept-summary{
            font-size:1.05rem;color:var(--dim);margin-bottom:28px;
            padding:16px 20px;background:rgba(255,255,255,.03);
            border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
        }

        .mini-card{
            background:rgba(0,0,0,.3);border:1px solid var(--border);
            border-radius:14px;padding:20px;margin-bottom:16px;
        }
        .mini-term{
            font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;
            color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;
        }
        .mini-term::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
        pre{
            background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:10px;
            padding:16px;overflow-x:auto;margin:10px 0;
            font-family:'Fira Code',monospace;font-size:.88rem;line-height:1.6;color:#E2E8F0;
        }
        .mini-explain{
            font-size:.88rem;color:var(--dim);line-height:1.6;margin-top:10px;
            padding:10px 14px;background:rgba(6,214,160,.05);
            border-radius:8px;border:1px solid rgba(6,214,160,.1);
        }

        /* ━━━━━━━━━━━━━━━━ QUIZ TAB ━━━━━━━━━━━━━━━━━━━ */
        .quiz-controls{
            display:flex;flex-wrap:wrap;gap:16px;align-items:center;
            background:var(--bg-card);border:1px solid var(--border2);border-radius:18px;
            padding:20px 24px;margin-bottom:28px;
        }
        .ctrl-group{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
        .ctrl-label{font-size:.85rem;color:var(--dim);font-weight:600;white-space:nowrap}
        select{
            background:rgba(0,0,0,.4);border:1px solid var(--border2);
            border-radius:10px;color:var(--text);padding:9px 14px;
            font-family:'Inter',sans-serif;font-size:.9rem;cursor:pointer;
            flex:1;outline:none;
        }

        .qcard{
            background:var(--bg-card);border:1px solid var(--border2);border-radius:18px;
            padding:28px;margin-bottom:20px;
        }
        .qnum{
            font-family:'Fira Code',monospace;font-size:.8rem;color:var(--dim);
            margin-bottom:14px;display:flex;align-items:center;gap:8px;
        }
        .qtext{
            font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:700;
            color:#fff;margin-bottom:16px;line-height:1.5;
        }
        .opt{
            display:flex;align-items:flex-start;gap:14px;padding:14px 18px;
            background:rgba(0,0,0,.25);border:1.5px solid var(--border);
            border-radius:12px;cursor:pointer;margin-bottom:10px;
            transition:all .2s ease;
        }
        .opt:hover{background:rgba(30,41,59,.6)}
        .opt.correct { border-color: var(--correct); background: rgba(16,185,129,.1); }
        .opt.wrong { border-color: var(--wrong); background: rgba(239,68,68,.1); }

        /* ── Community Contribution ────────────────────────────── */
        #community-btn {
            position: fixed; left: 24px; bottom: 84px; z-index: 98;
            padding: 12px 20px; border-radius: 100px;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: var(--text); font-weight: 600; font-family: 'Outfit', sans-serif;
            backdrop-filter: blur(5px); cursor: pointer; transition: all 0.3s;
        }
        #community-btn:hover { background: rgba(255,255,255,0.2); border-color: var(--primary); }
        .community-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 200;
            align-items: center; justify-content: center; overflow-y: auto; padding: 20px;
        }
        .community-modal.active { display: flex; }
        .community-box {
            background: var(--bg-main); width: 100%; max-width: 600px;
            border-radius: 24px; border: 1px solid var(--border2); padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .community-box input {
            width: 100%; padding: 14px 18px; font-size: 1rem;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff;
            border-radius: 12px; margin-bottom: 15px; outline: none; transition: border-color 0.2s;
        }
        .community-box input:focus { border-color: var(--primary); }
        .btn-guide {
            background: rgba(16, 185, 129, 0.15); color: var(--correct); border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; float: right; margin-top: -30px; margin-bottom: 15px;
            transition: all 0.2s;
        }
        .btn-guide:hover { background: rgba(16, 185, 129, 0.3); }
        .c-loading { display: none; text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 20px; }

        /* Guide Modal */
        .guide-box {
            background: var(--bg-main); width: 100%; max-width: 500px; border-radius: 20px;
            border: 1px solid var(--border2); padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .guide-step { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .guide-step h4 { color: #F59E0B; margin-bottom: 8px; }

        @media(max-width:600px){
            .tabs{flex-direction:column;border-radius:16px}
            .tab{border-radius:10px;justify-content:center}
            .hstats{gap:20px}
            .fcard-container{height:320px}
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><span style="color:var(--primary)">MIO</span> Javascript Learning</h1>
    </header>

    <!-- TABS -->
    <div class="tabs" role="tablist">
        <button class="tab active" onclick="switchTab('concept')" id="tab-concept" role="tab">📚 Lý Thuyết</button>
        <button class="tab" onclick="switchTab('quiz')" id="tab-quiz" role="tab">🎯 Quiz</button>
    </div>

    <!-- ══════════════ CONCEPT PANEL ══════════════ -->
    <div class="panel active" id="panel-concept">
        <div id="concept-content"></div>
    </div>

    <!-- ══════════════ QUIZ PANEL ══════════════════ -->
    <div class="panel" id="panel-quiz">
        <div id="quiz-form"></div>
    </div>
</div>

<!-- COMMUNITY CONTRIBUTION UI -->
<button id="community-btn" onclick="openCommunity()">🤝 Đóng Góp (Public)</button>
<div class="community-modal" id="community-modal" onclick="closeCommunity(event)">
    <div class="community-box">
        <h3>🤝 Trạm Đóng Góp Cộng Đồng</h3>
        <p style="text-align:center; color:var(--dim); margin-bottom: 20px;">Dùng Gemini API để sinh dữ liệu mới.</p>
        
        <label>Gemini API Key:</label>
        <button class="btn-guide" onclick="document.getElementById('guide-modal').classList.add('active')">❓ Cách lấy</button>
        <input type="password" id="comm-apikey" placeholder="AIzaSy...">
        
        <label>Khái niệm JS:</label>
        <input type="text" id="comm-keyword" placeholder="VD: WeakMap...">
        
        <div class="c-loading" id="comm-loading">⏳ Đang xử lý...</div>
        <button class="btn-primary" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--primary); color:white; cursor:pointer;" onclick="submitCommunity()">🚀 Nạp Kiến Thức</button>
    </div>
</div>

<!-- API KEY GUIDE MODAL -->
<div class="community-modal" id="guide-modal" onclick="if(event.target.id === 'guide-modal') this.classList.remove('active')" style="z-index: 250;">
    <div class="guide-box">
        <h3 style="text-align:center; color:var(--primary); margin-bottom: 20px;">🔑 Lấy API Key Miễn Phí</h3>
        <div class="guide-step">
            <h4>Bước 1:</h4>
            <p><a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#3B82F6;">👉 Google AI Studio</a></p>
        </div>
        <div class="guide-step">
            <h4>Bước 2:</h4>
            <p>Bấm <strong>"Create API Key"</strong> và Copy mã.</p>
        </div>
        <button class="btn-primary" style="width:100%; padding:10px; border-radius:10px; border:none; background:var(--accent); color:white; cursor:pointer;" onclick="document.getElementById('guide-modal').classList.remove('active')">Đã Hiểu</button>
    </div>
</div>

<script>
function topicLabel(t) {
    const m = {scope:'Scope',closure:'Closure',this:'this',prototype:'Prototype',async:'Async',types:'Types'};
    return m[t] || t;
}

function updateProgress() {
    if (quizSubmitted) return;
    const answered = currentQuestions.filter((_, i) => document.querySelector(`[name="q${i}"]:checked`)).length;
    const pct = Math.round(answered / currentQuestions.length * 100);
    document.getElementById('q-progress').style.width = pct + '%';
}

function submitQuiz() {
    if (quizSubmitted) return;
    quizSubmitted = true;
    document.getElementById('quiz-actions').style.display = 'none';
    document.getElementById('q-progress').style.width = '100%';

    let score = 0;
    currentQuestions.forEach((q, i) => {
        const chosen = document.querySelector(`[name="q${i}"]:checked`);
        const chosenVal = chosen ? parseInt(chosen.value) : -1;
        const correct = q.answer;

        // Mark options
        for (let oi = 0; oi < q.options.length; oi++) {
            const el = document.getElementById(`opt-${i}-${oi}`);
            if (oi === correct) el.classList.add('correct-opt');
            else if (oi === chosenVal) el.classList.add('wrong-opt');
            // disable
            const radio = el.querySelector('input');
            if (radio) radio.disabled = true;
        }
        if (chosenVal === correct) score++;

        // Show explanation (use short_explain if available)
        document.getElementById(`explain-${i}`).innerHTML = `<strong>💡 Giải thích:</strong> ${q.short_explain || q.explanation}`;
        document.getElementById(`explain-${i}`).classList.add('show');
    });

    // Save wrong answers to localStorage for Spaced Repetition Review
    let reviewList = JSON.parse(localStorage.getItem('mio_review') || '{}');
    currentQuestions.forEach((q, i) => {
        const chosen = document.querySelector(`[name="q${i}"]:checked`);
        const chosenVal = chosen ? parseInt(chosen.value) : -1;
        if (chosenVal !== q.answer) {
            // Wrong answer, add to review or reset streak
            reviewList[q.id] = { streak: 0 };
        }
    });
    localStorage.setItem('mio_review', JSON.stringify(reviewList));

    // Score
    const pct = Math.round(score / currentQuestions.length * 100);
    const ring = document.getElementById('score-ring');
    ring.style.setProperty('--pct', pct + '%');
    document.getElementById('score-num').textContent = pct + '%';

    let msg, title;
    if (pct >= 90) { title = '🏆 Xuất Sắc!'; msg = `${score}/${currentQuestions.length} câu đúng. Bạn là JavaScript master!`; }
    else if (pct >= 70) { title = '🎉 Tốt Lắm!'; msg = `${score}/${currentQuestions.length} câu đúng. Tiếp tục luyện tập nhé!`; }
    else if (pct >= 50) { title = '📚 Cần Ôn Thêm'; msg = `${score}/${currentQuestions.length} câu đúng. Xem lại phần lý thuyết.`; }
    else { title = '💪 Cố Lên!'; msg = `${score}/${currentQuestions.length} câu đúng. Hãy học Flashcard trước nhé.`; }

    document.getElementById('result-title').textContent = title;
    document.getElementById('score-msg').textContent = msg;
    const rb = document.getElementById('result-box');
    rb.classList.add('show');
    rb.scrollIntoView({behavior:'smooth', block:'start'});
}

function retryQuiz() {
    buildQuiz();
    document.getElementById('panel-quiz').scrollIntoView({behavior:'smooth'});
}

// ━━━━━━━━━━━━━━━━━━━━ FLASHCARD ━━━━━━━━━━━━━━━━━━━━━━━━
let flashCards = [];
let flashIdx = 0;
let flashSeen = new Set();

function buildFlashCards() {
    flashCards = [];
    CONCEPT_DATA.forEach(t => {
        (t.concepts || []).forEach(c => {
            flashCards.push({ term: c.term, code: c.code, explain: c.short_explain || c.explain, topic: t.title, color: t.color });
        });
    });
    flashIdx = 0;
    flashSeen.clear();
    renderFlash();
    renderFlashProgress();
}

function renderFlash() {
    const c = flashCards[flashIdx];
    if (!c) return;
    document.getElementById('fc-term').textContent = c.term;
    const codeWrap = document.getElementById('fc-code-wrap');
    const codeEl = document.getElementById('fc-code');
    if (c.code) {
        codeEl.textContent = c.code;
        codeWrap.style.display = 'block';
    } else {
        codeWrap.style.display = 'none';
    }
    document.getElementById('fc-explain').innerHTML = c.explain.replace(/`([^`]+)`/g, '<strong>$1</strong>');
    document.getElementById('flash-count').textContent = (flashIdx + 1) + ' / ' + flashCards.length;
    // Reset flip
    document.getElementById('fcard').classList.remove('flipped');
    flashSeen.add(flashIdx);
    renderFlashProgress();
}

function renderFlashProgress() {
    const fp = document.getElementById('flash-progress');
    fp.innerHTML = flashCards.map((_, i) =>
        `<div class="fp-dot ${flashSeen.has(i) ? 'seen' : ''} ${i === flashIdx ? 'current' : ''}" onclick="goCard(${i})"></div>`
    ).join('');
}

function flipCard() {
    document.getElementById('fcard').classList.toggle('flipped');
}
function nextCard() {
    flashIdx = (flashIdx + 1) % flashCards.length;
    renderFlash();
}
function prevCard() {
    flashIdx = (flashIdx - 1 + flashCards.length) % flashCards.length;
    renderFlash();
}
function goCard(i) {
    flashIdx = i;
    renderFlash();
}
function shuffleCards() {
    flashCards = shuffle(flashCards);
    flashIdx = 0;
    flashSeen.clear();
    renderFlash();
}

// Keyboard nav for flashcard
document.addEventListener('keydown', e => {
    const panel = document.getElementById('panel-flash');
    if (!panel.classList.contains('active')) return;
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

// ━━━━━━━━━━━━━━━━━━━━ REVIEW (ÔN LẠI) ━━━━━━━━━━━━━━━━━━━
let reviewQuestions = [];
let reviewSubmitted = false;

function buildReviewQuiz() {
    reviewSubmitted = false;
    document.getElementById('review-actions').style.display = 'flex';
    
    let reviewList = JSON.parse(localStorage.getItem('mio_review') || '{}');
    const keys = Object.keys(reviewList);
    
    if (keys.length === 0) {
        document.getElementById('review-stats').innerHTML = "🎉 Tuyệt vời! Bạn không có câu hỏi nào cần ôn lại.";
        document.getElementById('review-form').innerHTML = "";
        document.getElementById('review-actions').style.display = 'none';
        return;
    }
    
    document.getElementById('review-stats').innerHTML = `Đang có ${keys.length} câu cần ôn lại (Streak đạt 5 sẽ tự xóa).`;
    
    // Pick questions from QUIZ_DATA based on keys
    reviewQuestions = QUIZ_DATA.filter(q => keys.includes(q.id.toString()));
    
    const form = document.getElementById('review-form');
    form.innerHTML = reviewQuestions.map((q, i) => {
        const streak = reviewList[q.id].streak;
        return `
        <div class="qcard" id="rqcard-${i}">
            <div class="qnum">
                <span>Câu ${i + 1} / ${reviewQuestions.length}</span>
                <span style="margin-left:auto; color:var(--accent);">🔥 Streak: ${streak}/5</span>
            </div>
            <div class="qtext">${esc(q.question)}</div>
            ${q.code ? `<div class="qcode"><pre><code>${esc(q.code)}</code></pre></div>` : ''}
            <div class="opts">
                ${q.options.map((opt, oi) => `
                    <label class="opt" id="ropt-${i}-${oi}">
                        <input type="radio" name="rq${i}" value="${oi}">
                        <span class="opt-dot"></span>
                        <span>${esc(opt)}</span>
                    </label>
                `).join('')}
            </div>
            <div class="explain-box" id="rexplain-${i}"></div>
        </div>
    `}).join('');
}

function submitReview() {
    if (reviewSubmitted || reviewQuestions.length === 0) return;
    reviewSubmitted = true;
    document.getElementById('review-actions').style.display = 'none';
    
    let reviewList = JSON.parse(localStorage.getItem('mio_review') || '{}');
    
    reviewQuestions.forEach((q, i) => {
        const chosen = document.querySelector(`[name="rq${i}"]:checked`);
        const chosenVal = chosen ? parseInt(chosen.value) : -1;
        const correct = q.answer;
        
        // Mark options
        for (let oi = 0; oi < q.options.length; oi++) {
            const el = document.getElementById(`ropt-${i}-${oi}`);
            if (oi === correct) el.classList.add('correct-opt');
            else if (oi === chosenVal) el.classList.add('wrong-opt');
            const radio = el.querySelector('input');
            if (radio) radio.disabled = true;
        }
        
        // Update Streak
        if (chosenVal === correct) {
            reviewList[q.id].streak += 1;
            if (reviewList[q.id].streak >= 5) {
                delete reviewList[q.id]; // Streak reached!
            }
        } else {
            reviewList[q.id].streak = 0; // Reset streak
        }
        
        // Show explanation
        document.getElementById(`rexplain-${i}`).innerHTML = `<strong>💡 Giải thích:</strong> ${q.short_explain || q.explanation}`;
        document.getElementById(`rexplain-${i}`).classList.add('show');
    });
    
    localStorage.setItem('mio_review', JSON.stringify(reviewList));
    document.getElementById('review-stats').innerHTML += ` <br><br>Đã nộp bài! Đang cập nhật streak... (F5 hoặc chọn lại tab để tải lại)`;
}

// ━━━━━━━━━━━━━━━━━━━━ SEARCH ━━━━━━━━━━━━━━━━━━━━━━━━
function openSearch() {
    document.getElementById('search-modal').classList.add('active');
    document.getElementById('search-input').focus();
}

function closeSearch(e) {
    if(e.target.id === 'search-modal') {
        document.getElementById('search-modal').classList.remove('active');
    }
}

function doSearch() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const res = document.getElementById('search-results');
    res.innerHTML = '';
    if (q.length < 2) return;
    
    let results = [];
    // Search Concepts
    CONCEPT_DATA.forEach((t, tIdx) => {
        (t.concepts || []).forEach((c, cIdx) => {
            let score = 0;
            if (c.term.toLowerCase().includes(q)) score += 10;
            if (c.short_explain && c.short_explain.toLowerCase().includes(q)) score += 5;
            if (score > 0) results.push({ type: 'Lý Thuyết', text: c.term, snippet: c.short_explain, score, tIdx });
        });
    });
    
    // Search Quiz
    QUIZ_DATA.forEach(qz => {
        let score = 0;
        if (qz.question.toLowerCase().includes(q)) score += 10;
        if (qz.short_explain && qz.short_explain.toLowerCase().includes(q)) score += 5;
        if (score > 0) results.push({ type: 'Quiz', text: qz.question, snippet: qz.short_explain, score, tIdx: -1 });
    });
    
    // Sort and render top 15
    results.sort((a,b) => b.score - a.score).slice(0, 15).forEach(r => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `<div class="search-title">[${r.type}] ${esc(r.text)}</div>
                         <div class="search-snippet">${esc(r.snippet || '').substring(0, 100)}...</div>`;
        div.onclick = () => {
            document.getElementById('search-modal').classList.remove('active');
            if(r.type === 'Lý Thuyết') {
                switchTab('concept');
                showTopic(r.tIdx);
            } else {
                switchTab('quiz');
            }
        };
        res.appendChild(div);
    });
}

// ━━━━━━━━━━━━━━━━━━━━ ADMIN INGESTION ━━━━━━━━━━━━━━
function openAdmin() {
    document.getElementById('admin-modal').classList.add('active');
    document.getElementById('admin-input').focus();
    document.getElementById('admin-msg').textContent = "";
}

function closeAdmin(e) {
    if(e.target.id === 'admin-modal') {
        document.getElementById('admin-modal').classList.remove('active');
    }
}

async function submitAdmin() {
    const keyword = document.getElementById('admin-input').value.trim();
    if(!keyword) return;
    
    // UI State Loading
    const btn = document.getElementById('admin-submit-btn');
    const loading = document.getElementById('admin-loading');
    const msg = document.getElementById('admin-msg');
    
    btn.style.display = 'none';
    loading.style.display = 'block';
    msg.textContent = "Đang dùng Gemini API phân tích nội dung... (Vui lòng đợi 15-20s)";
    msg.style.color = "var(--dim)";
    
    try {
        const response = await fetch('/api/ingest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keyword: keyword })
        });
        
        const data = await response.json();
        if(response.ok) {
            msg.textContent = "✅ " + data.message + ". Trang web sẽ tự động tải lại...";
            msg.style.color = "var(--correct)";
            setTimeout(() => window.location.reload(), 2000);
        } else {
            throw new Error(data.message || "Lỗi Server");
        }
    } catch(err) {
        msg.textContent = "❌ Lỗi: " + err.message;
        msg.style.color = "var(--wrong)";
        btn.style.display = 'flex';
        loading.style.display = 'none';
    }
}

// ━━━━━━━━━━━━━━━━━━━━ COMMUNITY CONTRIBUTION ━━━━━━━━━━
function openCommunity() {
    document.getElementById('community-modal').classList.add('active');
    document.getElementById('comm-msg').textContent = "";
}

function closeCommunity(e) {
    if(e.target.id === 'community-modal') {
        document.getElementById('community-modal').classList.remove('active');
    }
}

async function submitCommunity() {
    const apiKey = document.getElementById('comm-apikey').value.trim();
    const keyword = document.getElementById('comm-keyword').value.trim();
    if(!apiKey || !keyword) return alert("Vui lòng nhập đủ API Key và Tên Hàm!");
    
    // Ghi nhớ API Key vào LocalStorage
    localStorage.setItem('mio_api_key', apiKey);
    
    const btn = document.getElementById('comm-submit-btn');
    const loading = document.getElementById('comm-loading');
    const msg = document.getElementById('comm-msg');
    
    btn.style.display = 'none';
    loading.style.display = 'block';
    msg.textContent = "1/2: Đang dùng API của bạn để phân tích nội dung...";
    msg.style.color = "var(--dim)";
    
    const prompt = `Kiểm tra và sinh dữ liệu về khái niệm JavaScript: "${keyword}".
TRẢ VỀ DUY NHẤT ĐỊNH DẠNG JSON (Không chứa markdown, không lời dẫn), với cấu trúc chính xác như sau:
{
  "is_valid_js": true (chỉ true nếu đúng là hàm/khái niệm của JavaScript, nếu sai trả false),
  "reason": "Lý do nếu false, hoặc trống nếu true",
  "concept_data": {
    "term": "Tên hàm chuẩn xác",
    "code": "Ví dụ 2-3 dòng",
    "short_explain": "1-2 câu tóm tắt chuyên sâu",
    "explain": "HTML 6 phần (0. CÔNG THỨC..., 1. Đầu vào, 2. Thân hàm, 3. Đầu ra, 4. Phạm vi, 5. Side Effect) bọc trong <p> và <strong>."
  },
  "quiz_data": [
    {
      "difficulty": "medium",
      "question": "Câu hỏi mẹo 1?",
      "code": "Code...",
      "options": ["A", "B", "C", "D"],
      "answer": 0,
      "short_explain": "1-2 câu tóm tắt",
      "explanation": "HTML giải thích chi tiết"
    }
  ]
}`;

    try {
        // BƯỚC 1: Gọi Gemini bằng Key của User
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const reqBody = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.3, responseMimeType: "application/json" }
        };
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reqBody)
        });
        
        const raw = await response.json();
        if(raw.error) throw new Error(raw.error.message);
        
        const textData = raw.candidates[0].content.parts[0].text;
        const result = JSON.parse(textData);
        
        if(result.is_valid_js !== true) {
            throw new Error(`Từ khóa bị từ chối: ${result.reason}`);
        }
        
        // BƯỚC 2: Gửi JSON lên Vercel API để tạo Github Issue
        msg.textContent = "2/2: Đang gửi bài đóng góp lên máy chủ Github...";
        
        const backendRes = await fetch('/api/submit_contribution', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keyword: keyword, data: result })
        });
        
        if (!backendRes.ok) {
            const errData = await backendRes.json();
            throw new Error(errData.error || "Lỗi tạo Github Issue");
        }
        
        msg.textContent = "✅ Gửi thành công! Cảm ơn bạn. Bài đóng góp sẽ được tự động xét duyệt và xuất hiện trên web sau 1-2 phút nữa.";
        msg.style.color = "var(--correct)";
        
    } catch(err) {
        msg.textContent = "❌ Lỗi: " + err.message;
        msg.style.color = "var(--wrong)";
        btn.style.display = 'flex';
    } finally {
        loading.style.display = 'none';
    }
}

// ── Init ──────────────────────────────────────────────────
function init() {
    if (typeof CONCEPT_DATA === 'undefined' || typeof QUIZ_DATA === 'undefined') {
        document.body.innerHTML = '<div style="text-align:center;padding:100px;font-family:Inter,sans-serif;color:#94A3B8"><h2 style="color:#EF4444">⚠️ Thiếu file js_data.js</h2><p style="margin-top:12px">Hãy đảm bảo file <code>js_data.js</code> nằm cùng thư mục với <code>index.html</code></p></div>';
        return;
    }
    
    // Auto fill API Key if exists
    const savedKey = localStorage.getItem('mio_api_key');
    if(savedKey) document.getElementById('comm-apikey').value = savedKey;
    
    // Merge Community Data from js_community.js
    if (typeof COMMUNITY_CONCEPTS !== 'undefined' && typeof COMMUNITY_QUIZZES !== 'undefined') {
        if(COMMUNITY_CONCEPTS.length > 0) {
            CONCEPT_DATA.push({
                id: "community",
                title: "🌟 Đóng Góp Cộng Đồng",
                icon: "🌟",
                color: "#F59E0B",
                summary: "Những kiến thức tuyệt vời do cộng đồng tự nạp bằng API của riêng họ.",
                concepts: COMMUNITY_CONCEPTS
            });
        }
        if(COMMUNITY_QUIZZES.length > 0) {
            QUIZ_DATA = QUIZ_DATA.concat(COMMUNITY_QUIZZES);
        }
    }
    
    document.getElementById('stat-quiz').textContent = QUIZ_DATA.length;
    renderConcepts();
    buildQuiz();
    buildFlashCards();
    
    // Check local Admin Mode
    const host = window.location.hostname;
    if (host === 'localhost' || host === '127.0.0.1') {
        document.getElementById('admin-btn').style.display = 'block';
    }
}

// Wait for data to load
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
